name: Deployment Pipeline

on:
  push:
    branches: [prod, preprod, dev]
  pull_request:
    branches: [prod, preprod, dev]
    types: [opened, synchronize]

jobs:
  avoid_redundancy:
    name: Avoid redundancy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel Workflow Action
        uses: styfle/cancel-workflow-action@0.12.1


  secret_scanning:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Secret scanning
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown
  

  set_env_vars:
    name: Set environment variables
    runs-on: ubuntu-latest
    outputs: 
      SCRIPTS_PROJECT_ID: ${{ steps.env_vars.outputs.SCRIPTS_PROJECT_ID }}
      SCRIPTS_GCS: ${{ steps.env_vars.outputs.SCRIPTS_GCS }}
      DAG_PROJECT_ID: ${{ steps.env_vars.outputs.DAG_PROJECT_ID }}
      DAG_GCS: ${{ steps.env_vars.outputs.DAG_GCS }}
    steps:
      - id: 'env_vars'
        name: Setup enviroment
        shell: bash
        run: |-
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            branch=$(echo ${{ github.base_ref }} | tr / -)
          else
            branch=$(echo ${{ github.ref_name }} | tr / -)
          fi

          if [ $branch = "prod" ]; then 
            scripts_project_id="cl-bigdata-analytics-prod";
            scripts_gcs="cl-bigdata-analytics-prod-us-dataproc-scripts";
            dag_project_id="cl-orquestador-prod";
            dag_gcs="us-east1-cl-orquestador-pro-df623903-bucket";
          elif [ $branch = "preprod" ]; then 
            scripts_project_id="cl-bigdata-analytics-preprod";
            scripts_gcs="cl-bigdata-analytics-preprod-us-dataproc-scripts";
            dag_project_id="cl-orquestador-preprod";
            dag_gcs="us-east1-cl-orquestador-pre-57dc49ea-bucket";
          elif [ $branch = "dev" ]; then 
            scripts_project_id="cl-bigdata-analytics";
            scripts_gcs="cl-bigdata-analytics-dev-us-dataproc-scripts";
            dag_project_id="cl-orquestador-preprod";
            dag_gcs="us-east1-cl-orquestador-pre-57dc49ea-bucket";
          else 
            echo "invalid environment"; exit -1
          fi
          echo "SCRIPTS_PROJECT_ID=$(echo $scripts_project_id)" >> $GITHUB_OUTPUT;
          echo "SCRIPTS_GCS=$(echo $scripts_gcs)" >> $GITHUB_OUTPUT;
          echo "DAG_PROJECT_ID=$(echo $dag_project_id)" >> $GITHUB_OUTPUT;
          echo "DAG_GCS=$(echo $dag_gcs)" >> $GITHUB_OUTPUT;


  check_lint:
    name: Lint code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - id: set_ruff_config_path
        name: Set ruff config file
        shell: bash
        run: |-
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            branch=$(echo ${{ github.base_ref }} | tr / -)
          else
            branch=$(echo ${{ github.ref_name }} | tr / -)
          fi

          if [ $branch = "prod" ]; then 
              echo "RUFF_CONFIG_PATH=lint/prod_ruff.toml" >> $GITHUB_ENV
          else
              echo "RUFF_CONFIG_PATH=lint/dev_ruff.toml" >> $GITHUB_ENV
          fi

      - name: Ruff Lint
        uses: astral-sh/ruff-action@v3
        with:
          args: "check -q --config ${{ env.RUFF_CONFIG_PATH }}"
          version: "0.12.12"

# ------------------------------------------------------------------

  gcs_upload_scripts:
    needs: [secret_scanning, check_lint, set_env_vars]
    if: ${{ github.event_name == 'push' }}
    name: Upload scripts
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - id: 'checkout'
        name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: auth
        name: Auth with GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Remove examples dir
        if: ${{ github.ref_name == 'prod' }}
        run: rm -rf src/examples

      - name: Upload python commons to GCS
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          project_id: ${{ needs.set_env_vars.outputs.SCRIPTS_PROJECT_ID }}
          destination: ${{ needs.set_env_vars.outputs.SCRIPTS_GCS }}
          path: src
          glob: 'common/**'
          gzip: false
          parent: false
          process_gcloudignore: false

      - name: Upload project scripts to GCS
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          project_id: ${{ needs.set_env_vars.outputs.SCRIPTS_PROJECT_ID }}
          destination: ${{ needs.set_env_vars.outputs.SCRIPTS_GCS }}
          path: src
          glob: '*/scripts/*.py'
          gzip: false
          parent: false
          process_gcloudignore: false
          headers: |-
            content-type: text/x-python

      - name: Upload project GBQ objects to GCS
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          project_id: ${{ needs.set_env_vars.outputs.SCRIPTS_PROJECT_ID }}
          destination: ${{ needs.set_env_vars.outputs.SCRIPTS_GCS }}
          path: src
          glob: '*/gbq_objects/**'
          gzip: false
          parent: false
          process_gcloudignore: false

      - name: Upload ingest scripts to GCS
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          project_id: ${{ needs.set_env_vars.outputs.SCRIPTS_PROJECT_ID }}
          destination: ${{ needs.set_env_vars.outputs.SCRIPTS_GCS }}
          path: src
          glob: 'ingest/*/scripts/*.py'
          gzip: false
          parent: false
          process_gcloudignore: false
          headers: |-
            content-type: text/x-python

      - name: Upload ingest GBQ objects to GCS
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          project_id: ${{ needs.set_env_vars.outputs.SCRIPTS_PROJECT_ID }}
          destination: ${{ needs.set_env_vars.outputs.SCRIPTS_GCS }}
          path: src
          glob: 'ingest/*/gbq_objects/**'
          gzip: false
          parent: false
          process_gcloudignore: false


  gcs_upload_dag_env_config:
    needs: [secret_scanning, check_lint, set_env_vars]
    if: ${{ github.event_name == 'push' }}
    name: Add DAG env config json
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - id: 'checkout'
        name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: auth
        name: Auth with GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Upload env config to GCS
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          project_id: ${{ needs.set_env_vars.outputs.SCRIPTS_PROJECT_ID }}
          destination: ${{ needs.set_env_vars.outputs.DAG_GCS }}/dags/${{ github.ref_name }}/${{ github.repository }}/src
          path: src
          glob: 'common/constants/dag_env_config.json'
          gzip: false
          parent: false
          process_gcloudignore: false


  gcs_upload_project_dags:
    needs: [secret_scanning, check_lint, set_env_vars]
    if: ${{ github.event_name == 'push' }}
    name: Upload DAGs
    uses: smu-chile/unidata_advanced_analytics/.github/workflows/gcs_dag_upload.yaml@prod
    permissions:
      contents: 'read'
      id-token: 'write'
    secrets:
      gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      gcp_workload_identity: ${{ secrets.GCP_WORKLOAD_IDENTITY }}
    with:
      glob_expression: '*/*.py'
      dag_project_id: ${{ needs.set_env_vars.outputs.DAG_PROJECT_ID }}
      dag_gcs: ${{ needs.set_env_vars.outputs.DAG_GCS }}


  gcs_upload_ingest_dags:
    needs: [secret_scanning, check_lint, set_env_vars]
    if: ${{ github.event_name == 'push' }}
    name: Upload ingest DAGs to GCS
    uses: smu-chile/unidata_advanced_analytics/.github/workflows/gcs_dag_upload.yaml@prod
    permissions:
      contents: 'read'
      id-token: 'write'
    secrets:
      gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      gcp_workload_identity: ${{ secrets.GCP_WORKLOAD_IDENTITY }}
    with:
      glob_expression: 'ingest/*/*.py'
      dag_project_id: ${{ needs.set_env_vars.outputs.DAG_PROJECT_ID }}
      dag_gcs: ${{ needs.set_env_vars.outputs.DAG_GCS }}


  docker_image_build:
    needs: [secret_scanning, set_env_vars]
    name: Build docker image
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - id: 'checkout'
        name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: find_modified_dockerfiles
        name: Find modified Dockefiles
        run: |-
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.event.sha }} -- src/)

          # Get only dockerfiles and its project_names
          CHANGED_DOCKERFILES=()
          # Iterate through the changed files
          for file in $CHANGED_FILES; do
              if [[ -e $file && $file == *"Dockerfile" ]]; then
                  CHANGED_DOCKERFILES+=("$file")
              fi
          done

          # Check if the list is NOT empty
          if [ -n "$CHANGED_DOCKERFILES" ]; then
            echo "Detected changes in these dockerfiles:"
            for x in ${CHANGED_DOCKERFILES[@]}; do
              echo " - $x"
            done

            # Output list
            {
              echo "CHANGED_DOCKERFILES<<EOF"
              printf "%s\n" "${CHANGED_DOCKERFILES[@]}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            # Output flag
            echo "CHANGED_DOCKERFILES_FLAG=true" >> $GITHUB_OUTPUT

          else
            echo "No Dockefiles changes detected in 'src/'."
          fi

      - id: auth
        name: Auth with GCP
        uses: google-github-actions/auth@v2
        if: steps.find_modified_dockerfiles.outputs.CHANGED_DOCKERFILES_FLAG == 'true'
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - id: auth_docker
        name: Auth Docker with GCP
        if: steps.find_modified_dockerfiles.outputs.CHANGED_DOCKERFILES_FLAG == 'true'
        run: gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      - id: build_docker_images
        name: Build Docker images
        if: steps.find_modified_dockerfiles.outputs.CHANGED_DOCKERFILES_FLAG == 'true'
        run: |-
          # Assing variables
          CHANGED_DOCKERFILES="${{ steps.find_modified_dockerfiles.outputs.CHANGED_DOCKERFILES }}"

          for CHANGED_DOCKERFILE in $CHANGED_DOCKERFILES; do
            DOCKER_PROJECT_NAME=$(echo "$CHANGED_DOCKERFILE" | grep -oP '(?<=src/).*(?=/dependencies)' | sed 's/[^A-Za-z1-9]/-/g')
            DOCKERFILE_PATH=$(dirname "$CHANGED_DOCKERFILE")

            IMAGE_TAG="us-east1-docker.pkg.dev/${{ needs.set_env_vars.outputs.SCRIPTS_PROJECT_ID }}/dataproc-worker-images/${DOCKER_PROJECT_NAME}:latest"

            echo "Building ${DOCKER_PROJECT_NAME} image using ${CHANGED_DOCKERFILE} file"
            docker build -q -t $IMAGE_TAG $DOCKERFILE_PATH
          done
          
          echo "$(docker image ls)"

      - id: push_docker_images
        name: Push Docker image
        if: github.event_name == 'push' && steps.find_modified_dockerfiles.outputs.CHANGED_DOCKERFILES_FLAG == 'true'
        run: |-
          # Assing variables
          CHANGED_DOCKERFILES="${{ steps.find_modified_dockerfiles.outputs.CHANGED_DOCKERFILES }}"

          for CHANGED_DOCKERFILE in $CHANGED_DOCKERFILES; do
            DOCKER_PROJECT_NAME=$(echo "$CHANGED_DOCKERFILE" | grep -oP '(?<=src/).*(?=/dependencies)' | sed 's/[^A-Za-z1-9]/-/g')
            DOCKERFILE_PATH=$(dirname "$CHANGED_DOCKERFILE")

            IMAGE_TAG="us-east1-docker.pkg.dev/${{ needs.set_env_vars.outputs.SCRIPTS_PROJECT_ID }}/dataproc-worker-images/${DOCKER_PROJECT_NAME}:latest"

            echo "Pushing ${DOCKER_PROJECT_NAME} image"
            docker push -q $IMAGE_TAG
          done