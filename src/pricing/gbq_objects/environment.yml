name: gcp_env

channels:
  - conda-forge
  - defaults

dependencies:
  # Núcleo
  - python=3.12
  - pip>=24

  # Jupyter
  - jupyterlab
  - ipykernel
  - nb_conda_kernels
  - ipywidgets

  # Ciencia de datos
  - pandas>=2.2
  - numpy>=1.26
  - scipy
  - scikit-learn
  - xgboost>=2.0
  - matplotlib
  - pyarrow>=15
  - fastparquet
  - joblib
  - tqdm
  - requests
  - pyyaml
  - openpyxl
  - xlrd
  - tzdata

  # Filesystems / IO
  - fsspec
  - s3fs
  - gcsfs

  # AWS
  - boto3
  - awscli
  - awswrangler
  - pyathena

  # Estilo / calidad
  - ruff
  - black
  - pre-commit

  # Paquetes vía pip (SDKs de Google y extras)
  - pip:
      - google-cloud-bigquery
      - google-cloud-bigquery-storage
      - google-cloud-storage
      - google-cloud-secret-manager
      - google-cloud-pubsub
      - google-cloud-aiplatform
      - google-auth
      - google-auth-oauthlib
      - db-dtypes
      - pandas-gbq
      - google-cloud-data-fusion
